<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nerdearla Live Captions</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>Nerdearla Live Captions</h1>
            <p>Transcripción y traducción en tiempo real</p>
        </header>

        <section id="roomView">

            <div class="room-header">
                <h2>Estás en: <span id="roomName">—</span></h2>
                <button id="newSessionButton">➕ Nueva sala</button>
            </div>

            <div class="audio-selector">
                <label for="audioSelect">Elegir audio:</label>
                <select id="audioSelect">
                    <option value="">— Seleccioná un audio —</option>
                </select>
                <button id="playButton">▶ Reproducir</button>
            </div>

            <div class="status">
                <span id="status-indicator">●</span>
                <span id="status-text">Desconectado</span>
            </div>

            <div class="captions">
                <div class="caption-box">
                    <h2>Original</h2>
                    <p id="original">Esperando audio...</p>
                </div>
                <div class="caption-box">
                    <h2>Español</h2>
                    <p id="translation">Esperando traducción...</p>
                </div>
            </div>

        </section>

    </main>

    <script src="/static/app.js"></script>
</body>
</html>
